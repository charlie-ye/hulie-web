// ==================== Utils ====================
function formatPrice(p) { return p.toFixed(2); }
function formatSales(s) { return s >= 10000 ? (s/10000).toFixed(1) + '万' : s.toLocaleString(); }

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}

// ==================== Search ====================
function searchProducts(keyword, sort) {
    if (!keyword) return PRODUCTS.slice();
    const kw = keyword.toLowerCase();
    let results = PRODUCTS.filter(p =>
        p.name.toLowerCase().includes(kw) ||
        p.platformName.includes(kw) ||
        p.shopName.toLowerCase().includes(kw)
    );
    // fuzzy: split keyword and OR match
    if (results.length === 0) {
        const parts = kw.split(/\s+/).filter(p => p.length >= 2);
        if (parts.length > 0) {
            results = PRODUCTS.filter(p =>
                parts.some(part => p.name.toLowerCase().includes(part))
            );
        }
    }
    // fallback: return popular items
    if (results.length === 0) {
        results = PRODUCTS.slice().sort((a,b) => b.sales - a.sales).slice(0, 20);
    }
    return sortProducts(results, sort);
}

function sortProducts(products, sort) {
    const sorted = [...products];
    switch(sort) {
        case 'price': sorted.sort((a,b) => a.price - b.price); break;
        case 'sales': sorted.sort((a,b) => b.sales - a.sales); break;
        case 'rating': sorted.sort((a,b) => b.rating - a.rating); break;
    }
    // mark cheapest
    if (sorted.length > 0) {
        const minPrice = sorted[0].price;
        sorted.forEach(p => p.best = p.price === minPrice);
    }
    return sorted;
}

function getCompareList(product) {
    const baseName = product.name.replace(/\s*(银色|黑色|白色|灰色|蓝色|红色|金色|钛金属|钛灰|雅丹黑|冰川银|冰霜银|镍铜色|星辰灰|星野|国行|日版|海外版|标准版).*$/i, '').trim();
    return PRODUCTS.filter(p => p.name.toLowerCase().includes(baseName.toLowerCase().substring(0, 8)) && p.id !== product.id)
        .sort((a,b) => a.price - b.price);
}

function renderCategories() {
    const grid = document.getElementById('catGrid');
    grid.innerHTML = CATEGORIES.map(c => `
        <div class="cat-item" onclick="searchByCategory('${c.keyword}')">
            <div class="cat-icon" style="background:${c.color}">${c.name.substring(0,2)}</div>
            <span class="cat-name">${c.name}</span>
        </div>
    `).join('');
}

                    <span class="price-current"><small>&yen;</small>${formatPrice(p.price)}</span>
                    <span class="price-original">&yen;${formatPrice(p.originalPrice)}</span>
                    ${p.originalPrice > p.price ? `<span class="price-save">省${formatPrice(p.originalPrice - p.price)}</span>` : ''}
                </div>
            </div>
            <div class="product-actions">
                <button class="btn-buy" onclick="event.stopPropagation();goBuy(${p.id})">去购买</button>
                <button class="btn-coupon" onclick="event.stopPropagation();showToast('优惠券信息已复制')">领券</button>
            </div>
        </div>
    `).join('');
}

function renderCoupons() {
    const grid = document.getElementById('couponGrid');
    grid.innerHTML = COUPONS.map(c => `
        <div class="coupon-card">
            <div class="coupon-left coupon-${c.platform}">
                <span class="coupon-amount"><small>&yen;</small>${c.amount}</span>
                <span class="coupon-cond">满${c.threshold}可用</span>
            </div>
            <div class="coupon-right">
                <span class="coupon-title">${c.title}</span>
                <span class="coupon-date">${c.start} 至 ${c.end}</span>
                <button class="coupon-claim" style="${claimedCoupons.has(c.id) ? 'background:var(--gray-4);cursor:default;' : ''}" onclick="${claimedCoupons.has(c.id) ? '' : `claimCoupon(${c.id})`}">${claimedCoupons.has(c.id) ? '已领取' : '立即领取'}</button>
            </div>
        </div>
    `).join('');
}

function renderCompare(product) {
    const compareList = getCompareList(product);
    if (compareList.length === 0) {
        document.getElementById('compareSection').style.display = 'none';
        return;
    }
    document.getElementById('compareSection').style.display = 'block';
    document.getElementById('compareTitle').textContent = `${product.name.substring(0,15)}... 多平台比价`;
    const minPrice = Math.min(product.price, ...compareList.map(p => p.price));
    const allItems = [{...product, isCurrent: true}, ...compareList];
    document.getElementById('compareList').innerHTML = allItems.map(p => `
        <div class="compare-row">
            <span class="compare-platform platform-tag platform-${p.platform}" style="position:static;display:inline-block;">${p.platformName}${p.isCurrent ? '(当前)' : ''}</span>
            <span class="compare-price ${p.price === minPrice ? 'compare-cheapest' : ''}">&yen;${formatPrice(p.price)} ${p.price === minPrice ? '- 最低价' : ''}</span>
            ${!p.isCurrent ? `<button class="btn-buy" style="width:auto;height:32px;padding:0 16px;font-size:13px;" onclick="goBuy(${p.id})">去购买</button>` : ''}
        </div>
    `).join('');
}

// ==================== Actions ====================
function doSearch() {
    const input = document.getElementById('searchInput');
    const keyword = input.value.trim();
    if (!keyword) { showToast('请输入商品名称'); return; }
    currentKeyword = keyword;
    const results = searchProducts(keyword, currentSort);
    document.getElementById('hotSection').style.display = 'none';
    document.getElementById('searchSection').style.display = 'block';
    document.getElementById('searchTitle').textContent = `"${keyword}" 搜索结果 (${results.length}件)`;
    document.getElementById('emptyState').style.display = results.length === 0 ? 'block' : 'none';
    document.getElementById('searchGrid').style.display = results.length === 0 ? 'none' : 'grid';
    renderProducts(results, 'searchGrid');
    document.getElementById('compareSection').style.display = 'none';
}

function clearSearch() {
    document.getElementById('searchInput').value = '';
    currentKeyword = '';
    document.getElementById('hotSection').style.display = 'block';
    document.getElementById('searchSection').style.display = 'none';
    document.getElementById('compareSection').style.display = 'none';
    renderHotDeals();
    window.scrollTo({top: 0, behavior: 'smooth'});
}

function setSort(sort, el) {
    currentSort = sort;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    if (currentKeyword) doSearch();
}

function searchByCategory(keyword) {
    document.getElementById('searchInput').value = keyword;
    doSearch();
    document.getElementById('catGrid').scrollIntoView({behavior: 'smooth', block: 'center'});
}

function showDetail(id) {
    const product = PRODUCTS.find(p => p.id === id);
    if (!product) return;
    renderCompare(product);
    document.getElementById('compareSection').scrollIntoView({behavior: 'smooth', block: 'start'});
}

function goBuy(id) {
    const product = PRODUCTS.find(p => p.id === id);
    if (!product) return;
    showToast('正在跳转到' + product.platformName + '...');
    // In production, this would open the affiliate link
    setTimeout(() => {
        showToast('演示模式 - 实际将跳转到' + product.platformName + '购买页面');
    }, 1000);
}

function claimCoupon(id) {
    if (claimedCoupons.has(id)) return;
    claimedCoupons.add(id);
    localStorage.setItem('claimedCoupons', JSON.stringify([...claimedCoupons]));
    renderCoupons();
    showToast('优惠券领取成功！');
}

function renderHotDeals() {
    const hot = PRODUCTS.slice().sort((a,b) => b.sales - a.sales).slice(0, 8);
    hot.forEach(p => p.best = p.price === hot.reduce((min, x) => x.price < min ? x.price : min, hot[0].price));
    renderProducts(hot, 'hotGrid');
}

// ==================== Init ====================
document.addEventListener('DOMContentLoaded', () => {
    renderCategories();
    renderHotDeals();
    renderCoupons();
    // Enter key search
    document.getElementById('searchInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') doSearch();
    });
});
</script>

</body>
</html>
